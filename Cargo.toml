[workspace]
resolver = "3"
members = ["crates/whippyflight-control", "crates/whippyflight-sim"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Oblarg"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Oblarg/whippyflight"

[workspace.dependencies]
whippyflight-control = { path = "crates/whippyflight-control", version = "0.1.0" }
# >= 0.3.4 for standard gravity (`g_n`), 0.3.5 for compile-time float rescale factors.
whippyunits = { version = "0.3.5", default-features = false }
whippyalgebra = { version = "0.1.1", default-features = false, features = ["nalgebra"] }
libm = "0.2"
bytemuck = { version = "1", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
