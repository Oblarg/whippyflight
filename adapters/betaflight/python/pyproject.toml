[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whippyflight-betaflight"
version = "0.1.0"
description = "Betaflight tools for whippyflight: blackbox decoding, the plant fit, and sensor noise extraction"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "Oblarg" }]
requires-python = ">=3.11"
dependencies = [
    "whippyflight",
    "numpy>=2",
    "scipy>=1.13",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["whippyflight_betaflight"]
