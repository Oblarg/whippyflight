[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whippyflight-betaflight"
version = "0.1.0"
description = "Betaflight tools for whippyflight: blackbox decoding, the plant fit, and sensor noise extraction"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Oblarg" }]
keywords = ["betaflight", "blackbox", "system-identification", "multirotor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "whippyflight>=0.1.0,<0.2",
    "numpy>=2",
    "scipy>=1.13",
]

[project.optional-dependencies]
plots = ["whippyflight[plots]>=0.1.0,<0.2", "matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/Oblarg/whippyflight"

[tool.setuptools]
packages = ["whippyflight_betaflight"]
