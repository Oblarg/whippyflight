[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whippyflight"
version = "0.1.0"
description = "Gain generation for whippyflight-control: DARE over a motor-speed grid, packed into .wfg blobs"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Oblarg" }]
keywords = ["lqr", "multirotor", "flight-controller", "control"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "scipy>=1.13",
    "control>=0.10",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/Oblarg/whippyflight"

[tool.setuptools]
packages = ["whippyflight"]
